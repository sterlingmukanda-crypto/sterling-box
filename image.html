<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sterling Box — Image Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#09090d;
  color:#fff;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}

header{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #292933;
  background:#0d0d13;
}
.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.5px;
}
.logo span{color:#8b5cf6}

.app{
  display:grid;
  grid-template-columns:260px 1fr 280px;
  min-height:calc(100vh - 64px);
}

/* SIDEBARS */
.sidebar{
  padding:18px;
  background:#0d0d13;
  border-right:1px solid #292933;
  overflow:auto;
}
.right{
  border-right:0;
  border-left:1px solid #292933;
}

h3{
  margin:0 0 14px;
  font-size:14px;
  color:#aaa;
}

.section{
  margin-bottom:24px;
}

label{
  display:block;
  font-size:13px;
  color:#cfcfd6;
  margin-bottom:7px;
}

input[type=file],
select,
textarea{
  width:100%;
  background:#15151d;
  color:#fff;
  border:1px solid #30303b;
  border-radius:10px;
  padding:10px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
  color:#fff;
  background:#20202a;
  transition:.15s;
}
button:hover{background:#30303d}
button:disabled{opacity:.5;cursor:not-allowed}

.primary{
  background:#7c3aed;
}
.primary:hover{background:#8b5cf6}

.danger{
  background:#3a1820;
}

.style-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.style-btn.active{
  background:#7c3aed;
}

.accessories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.acc{
  font-size:20px;
  padding:9px 4px;
}

.range{
  width:100%;
}

.range-value{
  float:right;
  color:#9b9ba6;
}

/* CENTER */
.center{
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:auto;
}

.preview{
  width:min(900px,100%);
  min-height:420px;
  border:1px solid #292933;
  border-radius:18px;
  background:
    linear-gradient(45deg,#15151d 25%,transparent 25%),
    linear-gradient(-45deg,#15151d 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#15151d 75%),
    linear-gradient(-45deg,transparent 75%,#15151d 75%);
  background-size:30px 30px;
  background-position:0 0,0 15px,15px -15px,-15px 0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

#previewImage{
  max-width:100%;
  max-height:650px;
  object-fit:contain;
  display:none;
  transform-origin:center center;
}

.empty{
  color:#777783;
  text-align:center;
  padding:40px;
}

.ai-panel{
  width:min(900px,100%);
  margin-top:15px;
  background:#101017;
  border:1px solid #292933;
  border-radius:16px;
  padding:15px;
}

.ai-title{
  font-weight:700;
  margin-bottom:10px;
}

.ai-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.status{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  min-height:20px;
}

.download{
  width:100%;
  margin-top:8px;
}

.reset{
  width:100%;
}

/* MOBILE */
@media(max-width:1000px){
  .app{
    grid-template-columns:210px 1fr;
  }
  .right{
    display:none;
  }
}

@media(max-width:700px){
  header{height:56px}
  .app{
    display:block;
  }
  .sidebar{
    border-right:0;
    border-bottom:1px solid #292933;
  }
  .right{
    display:block;
    border-left:0;
    border-top:1px solid #292933;
  }
  .center{
    padding:12px;
  }
  .preview{
    min-height:300px;
  }
  .ai-buttons{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Sterling <span>Box</span> — Image Studio</div>
</header>

<div class="app">

<!-- LEFT -->
<aside class="sidebar">

  <div class="section">
    <h3>PHOTO PRINCIPALE</h3>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >
  </div>

  <div class="section">
    <h3>TRANSFORMATION IA</h3>

    <div class="style-grid">
      <button class="style-btn active" data-style="original">Original</button>
      <button class="style-btn" data-style="manga">Manga</button>
      <button class="style-btn" data-style="anime">Anime</button>
      <button class="style-btn" data-style="cartoon">Cartoon</button>
    </div>
  </div>

  <div class="section">
    <h3>FILTRES</h3>

    <label>
      Luminosité
      <span class="range-value" id="brightnessValue">100%</span>
    </label>
    <input class="range" id="brightness" type="range" min="50" max="150" value="100">

    <label>
      Contraste
      <span class="range-value" id="contrastValue">100%</span>
    </label>
    <input class="range" id="contrast" type="range" min="50" max="150" value="100">

    <label>
      Saturation
      <span class="range-value" id="saturationValue">100%</span>
    </label>
    <input class="range" id="saturation" type="range" min="0" max="200" value="100">
  </div>

  <div class="section">
    <h3>TEINTE DE PEAU</h3>

    <select id="skinTone">
      <option value="">Originale</option>
      <option value="light">Claire</option>
      <option value="medium">Moyenne</option>
      <option value="dark">Foncée</option>
      <option value="deep">Très foncée</option>
    </select>
  </div>

  <div class="section">
    <h3>COULEUR DES YEUX</h3>

    <select id="eyeColor">
      <option value="">Originale</option>
      <option value="blue">Bleus</option>
      <option value="green">Verts</option>
      <option value="brown">Marron</option>
      <option value="gray">Gris</option>
      <option value="hazel">Noisette</option>
    </select>
  </div>

  <div class="section">
    <h3>COULEUR DES CHEVEUX</h3>

    <select id="hairColor">
      <option value="">Originale</option>
      <option value="black">Noirs</option>
      <option value="brown">Bruns</option>
      <option value="blond">Blonds</option>
      <option value="red">Roux</option>
      <option value="white">Blancs</option>
      <option value="blue">Bleus</option>
      <option value="purple">Violets</option>
      <option value="pink">Roses</option>
    </select>
  </div>

  <div class="section">
    <h3>ACCESSOIRES</h3>

    <div class="accessories">
      <button class="acc" data-accessory="">❌</button>
      <button class="acc" data-accessory="sunglasses">😎</button>
      <button class="acc" data-accessory="crown">👑</button>
      <button class="acc" data-accessory="cap">🧢</button>
      <button class="acc" data-accessory="hat">🎩</button>
      <button class="acc" data-accessory="cat ears">🐱</button>
      <button class="acc" data-accessory="rabbit ears">🐰</button>
      <button class="acc" data-accessory="star accessory">⭐</button>
    </div>
  </div>

  <div class="section">
    <h3>ARRIÈRE-PLAN</h3>

    <select id="background">
      <option value="">Original</option>
      <option value="studio">Studio professionnel</option>
      <option value="nature">Nature</option>
      <option value="city">Ville</option>
      <option value="beach">Plage</option>
      <option value="space">Espace</option>
      <option value="fantasy">Fantaisie</option>
      <option value="neon">Néon futuriste</option>
    </select>

    <br><br>

    <label>Importer ton propre arrière-plan</label>
    <input id="backgroundInput" type="file" accept="image/*">
  </div>

  <div class="section">
    <button id="ultraHD" class="primary" style="width:100%">
      ✨ Ultra HD
    </button>
  </div>

  <div class="section">
    <button id="detectBtn" style="width:100%">
      🔎 Détecter le sujet
    </button>
  </div>

  <div class="section">
    <button id="downloadBtn" class="primary download">
      ⬇️ Télécharger
    </button>

    <button id="resetBtn" class="reset danger">
      ↩️ Réinitialiser
    </button>
  </div>

</aside>


<!-- CENTER -->
<main class="center">

  <div class="preview" id="preview">
    <div class="empty" id="empty">
      <div style="font-size:50px">🖼️</div>
      <div>Importe une photo pour commencer</div>
    </div>

    <img id="previewImage" alt="Aperçu">
  </div>

  <div class="ai-panel">

    <div class="ai-title">
      🤖 Décris exactement la génération IA que tu veux
    </div>

    <textarea
      id="prompt"
      placeholder="Exemple : transforme ma photo en illustration anime cinématographique, garde mon visage et ma pose, ajoute un éclairage bleu et un décor futuriste..."
    ></textarea>

    <div class="ai-buttons">
      <button class="primary" id="mangaBtn">Manga</button>
      <button class="primary" id="animeBtn">Anime</button>
      <button class="primary" id="cartoonBtn">Cartoon</button>
      <button class="primary" id="customBtn">✨ Générer</button>
    </div>

    <div class="status" id="status"></div>
  </div>

</main>


<!-- RIGHT -->
<aside class="sidebar right">

  <div class="section">
    <h3>RÉGLAGES</h3>

    <label>
      Luminosité
      <span class="range-value" id="brightnessValue2">100%</span>
    </label>
    <input class="range" id="brightness2" type="range" min="50" max="150" value="100">

    <br><br>

    <label>
      Contraste
      <span class="range-value" id="contrastValue2">100%</span>
    </label>
    <input class="range" id="contrast2" type="range" min="50" max="150" value="100">

    <br><br>

    <label>
      Saturation
      <span class="range-value" id="saturationValue2">100%</span>
    </label>
    <input class="range" id="saturation2" type="range" min="0" max="200" value="100">
  </div>

  <div class="section">
    <h3>DÉPLACEMENT</h3>

    <label>
      Zoom
      <span class="range-value" id="zoomValue">100%</span>
    </label>

    <input
      id="zoom"
      class="range"
      type="range"
      min="50"
      max="200"
      value="100"
    >
  </div>

  <div class="section">
    <h3>ÉTAT</h3>

    <div id="imageState" style="color:#999;font-size:13px">
      Aucune image chargée.
    </div>
  </div>

</aside>

</div>

<script>
/* =========================================================
   STERLING BOX — BACKEND RENDER
   ========================================================= */

const AI_WORKER_URL =
  "https://sterling-box-ai.onrender.com";


/* =========================================================
   ELEMENTS
   ========================================================= */

const imageInput = document.getElementById("imageInput");
const backgroundInput = document.getElementById("backgroundInput");

const previewImage = document.getElementById("previewImage");
const empty = document.getElementById("empty");

const promptInput = document.getElementById("prompt");
const status = document.getElementById("status");
const imageState = document.getElementById("imageState");

const brightness = document.getElementById("brightness");
const contrast = document.getElementById("contrast");
const saturation = document.getElementById("saturation");

const brightness2 = document.getElementById("brightness2");
const contrast2 = document.getElementById("contrast2");
const saturation2 = document.getElementById("saturation2");

const zoom = document.getElementById("zoom");

const skinTone = document.getElementById("skinTone");
const eyeColor = document.getElementById("eyeColor");
const hairColor = document.getElementById("hairColor");
const background = document.getElementById("background");

let originalImageFile = null;
let originalImageURL = "";
let backgroundImageURL = "";

let selectedStyle = "original";
let selectedAccessory = "";
let zoomValue = 100;


/* =========================================================
   IMAGE IMPORT
   ========================================================= */

imageInput.addEventListener("change", () => {

  const file = imageInput.files[0];

  if (!file) return;

  originalImageFile = file;

  if (originalImageURL) {
    URL.revokeObjectURL(originalImageURL);
  }

  originalImageURL = URL.createObjectURL(file);

  previewImage.src = originalImageURL;
  previewImage.style.display = "block";
  empty.style.display = "none";

  imageState.textContent =
    "Image chargée : " + file.name;

  status.textContent =
    "Photo prête pour la transformation.";

  applyLocalFilters();
});


/* =========================================================
   BACKGROUND IMPORT
   ========================================================= */

backgroundInput.addEventListener("change", () => {

  const file = backgroundInput.files[0];

  if (!file) return;

  if (backgroundImageURL) {
    URL.revokeObjectURL(backgroundImageURL);
  }

  backgroundImageURL = URL.createObjectURL(file);

  document.getElementById("preview").style.backgroundImage =
    `url("${backgroundImageURL}")`;

  document.getElementById("preview").style.backgroundSize =
    "cover";

  document.getElementById("preview").style.backgroundPosition =
    "center";

  status.textContent =
    "Arrière-plan personnalisé sélectionné. Il sera utilisé dans ta demande IA.";
});


/* =========================================================
   LOCAL FILTERS
   ========================================================= */

function applyLocalFilters() {

  const b = brightness.value;
  const c = contrast.value;
  const s = saturation.value;

  previewImage.style.filter =
    `brightness(${b}%)
     contrast(${c}%)
     saturate(${s}%)`;

  brightnessValue.textContent = b + "%";
  contrastValue.textContent = c + "%";
  saturationValue.textContent = s + "%";

  brightnessValue2.textContent = b + "%";
  contrastValue2.textContent = c + "%";
  saturationValue2.textContent = s + "%";
}

brightness.addEventListener("input", () => {
  brightness2.value = brightness.value;
  applyLocalFilters();
});

brightness2.addEventListener("input", () => {
  brightness.value = brightness2.value;
  applyLocalFilters();
});

contrast.addEventListener("input", () => {
  contrast2.value = contrast.value;
  applyLocalFilters();
});

contrast2.addEventListener("input", () => {
  contrast.value = contrast2.value;
  applyLocalFilters();
});

saturation.addEventListener("input", () => {
  saturation2.value = saturation.value;
  applyLocalFilters();
});

saturation2.addEventListener("input", () => {
  saturation.value = saturation2.value;
  applyLocalFilters();
});


/* =========================================================
   ZOOM
   ========================================================= */

zoom.addEventListener("input", () => {

  zoomValue = Number(zoom.value);

  document.getElementById("zoomValue").textContent =
    zoomValue + "%";

  previewImage.style.transform =
    `scale(${zoomValue / 100})`;
});


/* =========================================================
   STYLE BUTTONS
   ========================================================= */

document.querySelectorAll(".style-btn").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".style-btn")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedStyle =
      button.dataset.style;

    status.textContent =
      "Style sélectionné : " +
      selectedStyle;
  });

});


/* =========================================================
   ACCESSORIES
   ========================================================= */

document.querySelectorAll(".acc").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".acc")
      .forEach(b => b.style.outline = "none");

    button.style.outline =
      "2px solid #8b5cf6";

    selectedAccessory =
      button.dataset.accessory || "";

  });

});


/* =========================================================
   BUILD AI PROMPT
   ========================================================= */

function buildPrompt(style) {

  let parts = [];

  if (style === "manga") {

    parts.push(`
Transform this supplied photo into a professional
Japanese manga illustration.

Preserve the person's identity, face structure,
hairstyle, clothing, pose, body position and composition.

Use clean ink linework, manga screentones,
professional shading and detailed illustration quality.

Do not add another person.
Do not change the pose unnecessarily.
`);
  }

  if (style === "anime") {

    parts.push(`
Transform this supplied photo into a high-quality
Japanese anime illustration.

Preserve the person's identity, facial structure,
hairstyle, clothing, pose and composition.

Use polished anime line art, detailed hair,
natural expressive eyes and professional cel shading.

Do not add another person.
Do not change the pose unnecessarily.
`);
  }

  if (style === "cartoon") {

    parts.push(`
Transform this supplied photo into a polished,
professional cartoon illustration.

Preserve the person's identity, facial structure,
hairstyle, clothing, pose and composition.

Use clean expressive outlines and high-quality
cartoon rendering.

Do not add another person.
Do not change the pose unnecessarily.
`);
  }

  if (style === "custom" || style === "original") {

    parts.push(`
Edit the supplied photo according to the user's
instructions.

Preserve the person's identity and important
visual details unless a change is explicitly requested.
`);
  }


  if (skinTone.value) {

    parts.push(
      "Change the person's skin tone to " +
      skinTone.value +
      " naturally while preserving realistic facial details."
    );
  }


  if (eyeColor.value) {

    parts.push(
      "Change the person's eye color to " +
      eyeColor.value +
      "."
    );
  }


  if (hairColor.value) {

    parts.push(
      "Change the person's hair color to " +
      hairColor.value +
      " while preserving the hairstyle."
    );
  }


  if (selectedAccessory) {

    parts.push(
      "Add this accessory naturally: " +
      selectedAccessory +
      "."
    );
  }


  if (background.value) {

    parts.push(
      "Change the background to a " +
      background.value +
      " environment while keeping the person as the main subject."
    );
  }


  if (backgroundImageURL) {

    parts.push(`
Use the user's selected custom background as
the intended background of the final composition.
Keep the person as the main subject.
`);
  }


  if (promptInput.value.trim()) {

    parts.push(`
Additional user instructions:

${promptInput.value.trim()}
`);
  }


  parts.push(`
Create a coherent professional final image.

The result must be a genuine AI image transformation,
not a simple color filter, pixel effect or crude overlay.
`);

  return parts.join("\n");
}


/* =========================================================
   AI TRANSFORMATION
   ========================================================= */

async function aiTransform(style) {

  if (!originalImageFile) {

    alert("Importe d'abord une photo.");

    return;
  }


  selectedStyle = style;


  status.textContent =
    "🤖 Sterling Box prépare la génération IA...";

  document.querySelectorAll(".style-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.style === style
      );

    });


  try {

    const formData = new FormData();

    formData.append(
      "image",
      originalImageFile
    );

    formData.append(
      "style",
      style
    );

    formData.append(
      "prompt",
      buildPrompt(style)
    );


    const response = await fetch(
      AI_WORKER_URL + "/transform",
      {
        method: "POST",
        body: formData
      }
    );


    const contentType =
      response.headers.get("content-type") || "";


    if (!response.ok) {

      let message =
        "Erreur du serveur.";

      if (contentType.includes("application/json")) {

        const data =
          await response.json();

        message =
          data.error || message;

      } else {

        const text =
          await response.text();

        if (text) message = text;

      }

      throw new Error(message);
    }


    let imageURL = null;


    if (contentType.includes("application/json")) {

      const data =
        await response.json();

      if (!data.ok || !data.image) {

        throw new Error(
          data.error ||
          "Aucune image générée."
        );
      }

      imageURL = data.image;

    } else {

      const blob =
        await response.blob();

      imageURL =
        URL.createObjectURL(blob);
    }


    previewImage.src = imageURL;

    previewImage.style.display =
      "block";

    empty.style.display =
      "none";

    previewImage.onload = () => {

      applyLocalFilters();

      previewImage.style.transform =
        `scale(${zoomValue / 100})`;
    };


    imageState.textContent =
      "✨ Image IA générée avec succès.";

    status.textContent =
      "✅ Transformation terminée.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ " + error.message;

    alert(
      "La génération IA a échoué :\n\n" +
      error.message
    );
  }
}


/* =========================================================
   AI BUTTONS
   ========================================================= */

document.getElementById("mangaBtn")
  .addEventListener("click", () => {
    aiTransform("manga");
  });

document.getElementById("animeBtn")
  .addEventListener("click", () => {
    aiTransform("anime");
  });

document.getElementById("cartoonBtn")
  .addEventListener("click", () => {
    aiTransform("cartoon");
  });

document.getElementById("customBtn")
  .addEventListener("click", () => {
    aiTransform("custom");
  });


/* =========================================================
   ULTRA HD
   ========================================================= */

document.getElementById("ultraHD")
  .addEventListener("click", () => {

    promptInput.value +=
      (promptInput.value ? "\n\n" : "") +
      "Enhance the image with very high detail, sharpness and high-resolution professional quality.";

    status.textContent =
      "✨ Mode Ultra HD ajouté à la demande IA.";
  });


/* =========================================================
   DETECTION
   ========================================================= */

document.getElementById("detectBtn")
  .addEventListener("click", () => {

    if (!originalImageFile) {

      alert("Importe d'abord une photo.");

      return;
    }

    promptInput.value +=
      (promptInput.value ? "\n\n" : "") +
      "Accurately preserve the main person as the primary subject and keep the important facial and body details.";

    status.textContent =
      "🔎 Instructions de préservation du sujet ajoutées.";
  });


/* =========================================================
   BACKGROUND DESCRIPTION
   ========================================================= */

background.addEventListener("change", () => {

  if (background.value) {

    status.textContent =
      "Arrière-plan sélectionné : " +
      background.options[
        background.selectedIndex
      ].text;

  } else {

    status.textContent =
      "Arrière-plan original sélectionné.";
  }
});


/* =========================================================
   DOWNLOAD
   ========================================================= */

document.getElementById("downloadBtn")
  .addEventListener("click", async () => {

    if (!previewImage.src ||
        previewImage.style.display === "none") {

      alert("Aucune image à télécharger.");

      return;
    }


    try {

      const response =
        await fetch(previewImage.src);

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;
      link.download =
        "sterling-box-image.png";

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

    } catch {

      const link =
        document.createElement("a");

      link.href =
        previewImage.src;

      link.download =
        "sterling-box-image.png";

      link.click();
    }

  });


/* =========================================================
   RESET
   ========================================================= */

document.getElementById("resetBtn")
  .addEventListener("click", () => {

    brightness.value = 100;
    brightness2.value = 100;

    contrast.value = 100;
    contrast2.value = 100;

    saturation.value = 100;
    saturation2.value = 100;

    zoom.value = 100;
    zoomValue = 100;

    skinTone.value = "";
    eyeColor.value = "";
    hairColor.value = "";
    background.value = "";

    selectedAccessory = "";
    selectedStyle = "original";

    promptInput.value = "";

    document.querySelectorAll(".style-btn")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.style === "original"
        );

      });

    document.querySelectorAll(".acc")
      .forEach(button => {

        button.style.outline = "none";

      });

    previewImage.style.filter = "none";
    previewImage.style.transform = "scale(1)";

    document.getElementById("preview")
      .style.backgroundImage = "";

    if (originalImageURL) {

      previewImage.src =
        originalImageURL;

      previewImage.style.display =
        "block";

      empty.style.display =
        "none";
    }

    applyLocalFilters();

    status.textContent =
      "Projet réinitialisé.";

    imageState.textContent =
      originalImageFile
        ? "Photo originale restaurée."
        : "Aucune image chargée.";
  });


/* =========================================================
   INITIALISATION
   ========================================================= */

applyLocalFilters();

</script>

</body>
  </html>
